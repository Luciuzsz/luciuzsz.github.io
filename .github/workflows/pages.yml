name: Deploy Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages-deploy.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Apply
        env:
          AD7F7C: ${{ secrets.AD7F7C }}
          B435F9: ${{ secrets.B435F9 }}
        run: |
          python3 -c "
          import sys, pathlib, os
          meta_a = os.environ.get('AD7F7C', '')
          meta_b = os.environ.get('B435F9', '')
          page = pathlib.Path('index.html')
          src = page.read_text(encoding='utf-8')
          out = src
          if meta_a:
              out = out.replace('<!-- 6f9ba2e962eb0354396bf184ab9267 -->', meta_a)
          if meta_b:
              out = out.replace('<!-- 5a2207a9f6461da3bbafca3cc460fdd0f36570d4 -->', meta_b)
          if out == src and (meta_a or meta_b):
              sys.exit(1)
          if out != src:
              page.write_text(out, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: pages-deploy
        uses: actions/deploy-pages@v4
