<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 616 353" width="616" height="353" role="img" aria-label="Phone camera view with high-contrast outlines around a door, a table and a mug">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B1F24"/>
      <stop offset="1" stop-color="#363C44"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#434C56"/>
      <stop offset="1" stop-color="#363E47"/>
    </linearGradient>
    <clipPath id="screen"><rect x="214" y="40" width="188" height="273" rx="16"/></clipPath>
  </defs>
  <rect width="616" height="353" fill="url(#bg)"/>

  <!-- sound rings: audio description of what the camera sees -->
  <g fill="none" stroke="#F5F5F2" stroke-opacity=".14" stroke-width="2">
    <circle cx="308" cy="176" r="150"/>
    <circle cx="308" cy="176" r="200"/>
    <circle cx="308" cy="176" r="250"/>
  </g>

  <!-- phone -->
  <rect x="200" y="24" width="216" height="305" rx="30" fill="#0D1013" stroke="#59616A" stroke-width="3"/>
  <rect x="284" y="31" width="48" height="6" rx="3" fill="#2A3037"/>

  <g clip-path="url(#screen)">
    <rect x="214" y="40" width="188" height="273" fill="url(#wall)"/>
    <!-- floor -->
    <rect x="214" y="222" width="188" height="91" fill="#2A3037"/>
    <line x1="214" y1="222" x2="402" y2="222" stroke="#4B545E" stroke-width="2"/>

    <!-- scene objects: low contrast on purpose -->
    <rect x="228" y="76" width="56" height="146" rx="3" fill="#4D5762"/>
    <circle cx="272" cy="150" r="3.5" fill="#6B7682"/>
    <rect x="300" y="182" width="88" height="10" rx="2" fill="#4D5762"/>
    <rect x="306" y="192" width="7" height="30" fill="#4D5762"/>
    <rect x="375" y="192" width="7" height="30" fill="#4D5762"/>
    <rect x="337" y="160" width="20" height="22" rx="3" fill="#4D5762"/>
    <path d="M357 166h7a5 5 0 0 1 0 12h-7" fill="none" stroke="#4D5762" stroke-width="4"/>

    <!-- high-contrast outlines added by the AR layer -->
    <rect x="228" y="76" width="56" height="146" rx="3" fill="none" stroke="#FFD84D" stroke-width="4"/>
    <g fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round">
      <rect x="300" y="182" width="88" height="10" rx="2"/>
      <path d="M306 192v30M382 192v30"/>
    </g>
    <g fill="none" stroke="#F2A07B" stroke-width="4" stroke-linejoin="round">
      <rect x="337" y="160" width="20" height="22" rx="3"/>
      <path d="M357 166h7a5 5 0 0 1 0 12h-7"/>
    </g>

    <!-- focus brackets around the mug -->
    <g fill="none" stroke="#F5F5F2" stroke-width="3" stroke-linecap="round">
      <path d="M326 168v-10h10M368 158h10v10M378 176v10h-10M336 186h-10v-10"/>
    </g>

    <!-- audio strip -->
    <rect x="214" y="262" width="188" height="51" fill="#0D1013" fill-opacity=".82"/>
    <path d="M234 288h7l9-8v22l-9-8h-7z" fill="#F5F5F2"/>
    <path d="M257 281a10 10 0 0 1 0 14M263 277a16 16 0 0 1 0 22" fill="none" stroke="#F2A07B" stroke-width="3" stroke-linecap="round"/>
    <g fill="#F5F5F2">
      <rect x="284" y="283" width="5" height="10" rx="2.5"/>
      <rect x="294" y="277" width="5" height="22" rx="2.5"/>
      <rect x="304" y="280" width="5" height="16" rx="2.5"/>
      <rect x="314" y="273" width="5" height="30" rx="2.5"/>
      <rect x="324" y="279" width="5" height="18" rx="2.5"/>
      <rect x="334" y="283" width="5" height="10" rx="2.5"/>
      <rect x="344" y="278" width="5" height="20" rx="2.5"/>
      <rect x="354" y="284" width="5" height="8" rx="2.5"/>
      <rect x="364" y="281" width="5" height="14" rx="2.5"/>
      <rect x="374" y="285" width="5" height="6" rx="2.5"/>
    </g>
  </g>
</svg>
